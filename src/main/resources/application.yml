server:
  port: 8080

spring:
  application:
    name: todo-base-app
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:todo_base}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

todo:
  create:
    # 功能开关: false 时 /api/todo/items 返回"功能维护中"(可应急秒级止血)
    enabled: true

logging:
  level:
    com.dtazziboot.base: info
