spring:
  application:
    name: todo-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TODO_MYSQL_URL:jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${TODO_MYSQL_USERNAME:root}
    password: ${TODO_MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080