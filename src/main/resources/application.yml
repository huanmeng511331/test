spring:
  application:
    name: todo-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/todo?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dtaz.todo.model.entity

server:
  port: 8080